services:
  simulation:
    container_name: quadcopter_sim
    build:
      context: .
    stdin_open: true
    tty: true
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      SIM_WORLD: ${SIM_WORLD:-outdoor}
      SIM_GUI: ${SIM_GUI:-true}
      SIM_CONTROLLER: ${SIM_CONTROLLER:-true}
      SIM_TAKEOFF_ALTITUDE: ${SIM_TAKEOFF_ALTITUDE:-1.5}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    network_mode: host
